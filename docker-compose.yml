

services:

  backend:       #this is just a service name, you can name it anything you want, but make sure to use the same name in the nginx.conf file
    build: ./backend
    container_name: postgresql-main-backend
     # Force Docker Compose to read the file from your backend folder path:
    env_file:
      - ./backend/.env

  nginx:
    image: nginx:alpine
    container_name: nginx-postgresql-main-backend

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend
  



  